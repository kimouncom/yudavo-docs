openapi: 3.1.0
info:
  title: Randevou API
  version: 1.0.0
  description: |
    Canonical OpenAPI contract for the API currently mounted by `apps/api/src/index.ts`.

    Historical feature-level contracts still exist under `specs/**/contracts/openapi.yaml`,
    but this file is the runtime-aligned source of truth.
servers:
  - url: https://api.example.com
    description: Production API base URL
  - url: http://localhost:3000
    description: Local development API
tags:
  - name: health
  - name: widget
  - name: booking-actions
  - name: internal
  - name: admin
  - name: backoffice
paths:
  /api/health:
    get:
      tags: [health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/{slug}/slots:
    get:
      tags: [widget]
      summary: List available slots for a tenant
      description: |
        In production, a publishable key is required via `X-Publishable-Key` or `pk`.
        In dev/test, the implementation accepts slug-only access when no key is provided.
      operationId: getTenantSlots
      security:
        - PublishableKeyHeader: []
        - PublishableKeyQuery: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/PublishableKeyQuery"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotsResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid publishable key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetAuthError"
        "403":
          description: Publishable key does not match the tenant or origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetAuthError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantNotFoundError"
        "502":
          description: Calendar provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/{slug}/book:
    post:
      tags: [widget]
      summary: Create a booking for a tenant
      description: |
        In production, a publishable key is required via `X-Publishable-Key` or `pk`.
        In dev/test, the implementation accepts slug-only access when no key is provided.
      operationId: postTenantBook
      security:
        - PublishableKeyHeader: []
        - PublishableKeyQuery: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/PublishableKeyQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "200":
          description: Booking accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid publishable key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetAuthError"
        "403":
          description: Publishable key does not match the tenant or origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetAuthError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantNotFoundError"
        "409":
          description: Slot no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Calendar provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/book/confirm:
    get:
      tags: [booking-actions]
      summary: Confirm a booking from an email link
      operationId: getBookConfirm
      parameters:
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: Human-readable confirmation page
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid token format
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Invalid token
          content:
            text/html:
              schema:
                type: string
        "409":
          description: Action no longer allowed
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Internal error page
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [booking-actions]
      summary: Confirm a booking with JSON
      operationId: postBookConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingActionRequest"
      responses:
        "200":
          description: Booking confirmed or already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Action no longer allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/book/cancel:
    get:
      tags: [booking-actions]
      summary: Cancel a booking from an email link
      operationId: getBookCancel
      parameters:
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: Human-readable cancellation page
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid token format
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Invalid token
          content:
            text/html:
              schema:
                type: string
        "409":
          description: Action no longer allowed
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Internal error page
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [booking-actions]
      summary: Cancel a booking with JSON
      operationId: postBookCancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingActionRequest"
      responses:
        "200":
          description: Booking cancelled or already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Action no longer allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/{slug}/internal/bookings/expire-due:
    post:
      tags: [internal]
      summary: Expire overdue pending bookings for a tenant
      operationId: postInternalExpireDue
      security:
        - InternalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Batch expiration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpireDueSuccess"
        "401":
          description: Missing or invalid internal bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantNotFoundError"
  /api/{slug}/internal/bookings/{id}/resend-pending-email:
    post:
      tags: [internal]
      summary: Re-send the initial pending confirmation email
      operationId: postInternalResendPendingEmail
      security:
        - InternalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Pending email re-sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionSuccess"
        "401":
          description: Missing or invalid internal bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Tenant or booking not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TenantNotFoundError"
                  - $ref: "#/components/schemas/ApiError"
        "409":
          description: Booking is no longer pending confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/tenants:
    get:
      tags: [admin]
      summary: List tenants
      operationId: getAdminTenants
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Tenant summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
    post:
      tags: [admin]
      summary: Create a tenant
      operationId: postAdminTenants
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created. The raw tenant admin token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/admin/tenants/{slug}:
    get:
      tags: [admin]
      summary: Get one tenant
      operationId: getAdminTenant
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Public tenant representation without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
    patch:
      tags: [admin]
      summary: Update one tenant
      operationId: patchAdminTenant
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
    delete:
      tags: [admin]
      summary: Deactivate one tenant
      operationId: deleteAdminTenant
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Tenant deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/admin/tenants/{slug}/rotate-token:
    post:
      tags: [admin]
      summary: Rotate the tenant admin token
      operationId: postAdminTenantRotateToken
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: New tenant admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTokenResponse"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/admin/tenants/{slug}/publishable-keys:
    get:
      tags: [admin]
      summary: List publishable keys for a tenant
      operationId: getAdminTenantPublishableKeys
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Active and revoked publishable keys for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishableKeyListResponse"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
    post:
      tags: [admin]
      summary: Create a publishable key for a tenant
      operationId: postAdminTenantPublishableKeys
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublishableKeyRequest"
      responses:
        "201":
          description: Publishable key created. The raw key is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePublishableKeyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/admin/tenants/{slug}/publishable-keys/{keyId}:
    delete:
      tags: [admin]
      summary: Revoke a publishable key
      operationId: deleteAdminTenantPublishableKey
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Missing or invalid global admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/backoffice/tenants/{slug}:
    get:
      tags: [backoffice]
      summary: Get public tenant configuration for the backoffice
      operationId: getBackofficeTenant
      security:
        - AdminBearerAuth: []
        - TenantTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Public tenant configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackofficeTenant"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/backoffice/tenants/{slug}/bookings:
    get:
      tags: [backoffice]
      summary: List bookings for a tenant
      operationId: getBackofficeTenantBookings
      security:
        - AdminBearerAuth: []
        - TenantTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: status
          in: query
          required: false
          description: Comma-separated list of booking statuses
          schema:
            type: string
            examples:
              - pending_confirmation,confirmed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/backoffice/tenants/{slug}/bookings/{id}/confirm:
    post:
      tags: [backoffice]
      summary: Confirm a booking from the backoffice
      operationId: postBackofficeBookingConfirm
      security:
        - AdminBearerAuth: []
        - TenantTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Booking confirmed or already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionSuccess"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant or booking not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SimpleError"
                  - $ref: "#/components/schemas/ApiError"
        "409":
          description: Action no longer allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/backoffice/tenants/{slug}/bookings/{id}/cancel:
    post:
      tags: [backoffice]
      summary: Cancel a booking from the backoffice
      operationId: postBackofficeBookingCancel
      security:
        - AdminBearerAuth: []
        - TenantTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Booking cancelled or already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Tenant or booking not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SimpleError"
                  - $ref: "#/components/schemas/ApiError"
        "409":
          description: Action no longer allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    PublishableKeyHeader:
      type: apiKey
      in: header
      name: X-Publishable-Key
      description: Tenant-scoped widget publishable key used in production.
    PublishableKeyQuery:
      type: apiKey
      in: query
      name: pk
      description: Query-string alternative to `X-Publishable-Key`.
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Global admin token from `ADMIN_API_TOKEN`.
    InternalBearerAuth:
      type: http
      scheme: bearer
      description: Internal automation token from `BOOKING_INTERNAL_API_TOKEN`.
    TenantTokenAuth:
      type: apiKey
      in: header
      name: X-Tenant-Token
      description: Per-tenant admin token returned when the tenant is created or rotated.
  parameters:
    TenantSlug:
      name: slug
      in: path
      required: true
      description: Tenant slug
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
    BookingId:
      name: id
      in: path
      required: true
      description: Public booking identifier
      schema:
        type: string
    KeyId:
      name: keyId
      in: path
      required: true
      description: Publishable key identifier
      schema:
        type: string
    PublishableKeyQuery:
      name: pk
      in: query
      required: false
      description: Query-string alternative to `X-Publishable-Key`
      schema:
        type: string
    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    TokenQuery:
      name: token
      in: query
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 512
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    AppointmentSlot:
      type: object
      required: [start, end, date, label]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        label:
          type: string
    SlotsResponse:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentSlot"
    BookingRequest:
      type: object
      additionalProperties: false
      required: [start, end, name, email, phone]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          minLength: 3
          maxLength: 80
        message:
          type: string
          maxLength: 2000
    BookingStatus:
      type: string
      enum:
        - pending_confirmation
        - confirmed
        - cancelled_by_client
        - cancelled_by_admin
        - cancelled_auto
    BookingSuccess:
      type: object
      required: [success, bookingId, status, confirmationRequired, message]
      properties:
        success:
          type: boolean
          const: true
        bookingId:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        confirmationRequired:
          type: boolean
        confirmationDeadlineAt:
          type: string
          format: date-time
        message:
          type: string
    BookingActionRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
    BookingActionSuccess:
      type: object
